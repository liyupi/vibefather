# Refreshes README counts, showcase gallery, model list and repository description from vibefather.ai.
name: Refresh README showcase

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .github/scripts/sync-readme.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_META_TOKEN: ${{ secrets.REPO_META_TOKEN }}
